name: Deploy Website

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    # SET ENVIRONMENT VARIABLE UNTUK SELURUH JOB BUILD
    env:
      DATABASE_URL: "mysql://dummy:dummy@localhost:3306/dummy_db"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Disarankan upgrade ke Node 22 agar tidak ada warning EBADENGINE

      - name: Install dependencies & Generate Prisma
        run: npm ci
        env:
          DATABASE_URL: "mysql://dummy:dummy@localhost:3306/dummy_db"

      - name: Build project
        run: npm run build